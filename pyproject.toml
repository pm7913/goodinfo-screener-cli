[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goodinfo-screener-cli"
version = "0.1.0a0"
description = "CLI for saving and running Goodinfo stock screener presets with Playwright browser automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Robert" }
]
keywords = [
  "cli",
  "goodinfo",
  "playwright",
  "stock-screener",
  "taiwan-stocks"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Utilities"
]
dependencies = [
  "beautifulsoup4>=4.12",
  "playwright>=1.45",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5"
]

[project.urls]
Homepage = "https://github.com/pm7913/goodinfo-screener-cli"
Repository = "https://github.com/pm7913/goodinfo-screener-cli"
Issues = "https://github.com/pm7913/goodinfo-screener-cli/issues"

[project.scripts]
goodinfo = "goodinfo_screener.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/goodinfo_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM"
]
