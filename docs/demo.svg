<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">goodinfo-screener-cli terminal demo</title>
  <desc id="desc">A terminal screenshot showing the goodinfo run command, browser run metadata, parsed row count, and a preview of exported stock screener rows.</desc>
  <rect width="960" height="560" rx="14" fill="#141414"/>
  <rect x="1" y="1" width="958" height="558" rx="14" fill="none" stroke="#323232"/>
  <rect x="0" y="0" width="960" height="46" rx="14" fill="#222222"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="23" r="6" fill="#28c840"/>
  <text x="480" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#d6d6d6">goodinfo-screener-cli</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="36" y="82" fill="#8fd0ff">$</text>
    <text x="58" y="82" fill="#f5f5f5">goodinfo run high-margin --limit 5 --column-limit 6 --csv results/high-margin.csv</text>

    <text x="36" y="126" fill="#d7d7d7">Browser Run: high-margin</text>
    <text x="36" y="156" fill="#7dcfff">Field</text>
